[package]
name = "androidtool"
version = "0.1.0"
edition = "2024"
description = "AndroidTool - a portable Android device toolkit powered by Rust, egui and ADB"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.12"
qrcodegen = "1.8"
regex = "1.12"
ring = "0.17.14"
rfd = "0.16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
